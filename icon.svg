<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Sombra interior decorativa -->
  <rect x="32" y="32" width="448" height="448" rx="88" ry="88" fill="none" stroke="rgba(0,0,0,0.15)" stroke-width="2"/>
  <!-- Símbolo Bitcoin/CryptoFlow estilizado -->
  <g transform="translate(256 256)">
    <!-- Círculo decorativo de fondo -->
    <circle r="160" fill="url(#bgDark)" opacity="0.2"/>
    <!-- Letra B grande estilizada -->
    <text x="0" y="0" text-anchor="middle" dominant-baseline="central"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="320" font-weight="900" fill="#0a0e1a"
          style="letter-spacing: -8px;">₿</text>
  </g>
  <!-- Linea decorativa abajo simulando gráfico -->
  <path d="M 80 410 L 140 380 L 200 395 L 260 350 L 320 365 L 380 320 L 432 340"
        fill="none" stroke="#0a0e1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
</svg>
